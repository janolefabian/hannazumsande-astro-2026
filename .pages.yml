media:
  - name: images
    label: Bildarchiv
    input: public/media
    output: /media
    categories: [image]
    rename: safe
  - name: audio
    label: Audio
    input: public/media/audio
    output: /media/audio
    categories: [audio]
    rename: safe
  - name: documents
    label: Dokumente
    input: public/downloads
    output: /downloads
    categories: [document]
    rename: safe

content:
  - name: termine
    label: Kalender
    type: collection
    path: src/content/termine
    format: yaml-frontmatter
    filename:
      template: "{date}-{title}.md"
      field: create
    view:
      fields: [title, date, time, venue, city, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: asc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: time
        label: Uhrzeit
        type: string
        required: true
      - name: venue
        label: Veranstaltungsort
        type: string
        required: true
      - name: city
        label: Stadt
        type: string
      - name: link
        label: Link zum Veranstalter oder zu Tickets
        type: string
        description: "Optional. Bitte die vollständige Adresse mit https:// eintragen."
      - name: photo
        label: Foto
        type: image
        description: "Optional. Foto auswählen oder hochladen. Auch ein Foto allein macht den Auftritt anklickbar."
        options:
          media: images
      - name: photoAlt
        label: Bildbeschreibung
        type: string
        description: "Kurz beschreiben, was auf dem Foto zu sehen ist."
      - name: photoCredit
        label: Fotocredit
        type: string
        description: "Name der Fotografin oder des Fotografen, falls erforderlich."
      - name: featured
        label: Auf der Startseite hervorheben
        type: boolean
      - name: published
        label: Veröffentlicht
        type: boolean
        required: true
      - name: body
        label: Weitere Informationen
        type: rich-text
        description: "Optional, zum Beispiel Programm, weitere Solistinnen und Solisten oder Ensembles. Mit Informationen, Foto oder Veranstalterlink wird der Auftritt anklickbar. Ohne diese Angaben erscheint er nur in der Übersicht."
        options:
          media: false
      - name: example
        label: Enthält noch Beispielinhalt
        type: boolean
        default: false
        description: "Nur für unsere Entwürfe. Diese Detailseite bleibt aus Suchmaschinen und der Sitemap ausgeschlossen. Ausschalten, sobald die Angaben fertig sind."

  - name: vitaDownloads
    label: Vita Downloads
    type: file
    path: src/data/downloads.json
    format: json
    operations:
      delete: false
    fields:
      - name: vitaLong
        label: Vita lang
        type: file
        options:
          media: documents
          extensions: [pdf]
      - name: vitaShort
        label: Vita kurz
        type: file
        description: "Hier die Kurzfassung als PDF auswählen, sobald sie vorliegt."
        options:
          media: documents
          extensions: [pdf]

  - name: website
    label: Grunddaten
    type: file
    path: src/data/settings.json
    format: json
    operations:
      delete: false
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Beruf, type: string, required: true }
      - { name: location, label: Ort, type: string }
      - { name: intro, label: Text auf der Startseite, type: text, required: true }
      - { name: email, label: E Mail, type: string, required: true }
      - { name: phone, label: Telefon, type: string }
      - { name: management, label: Management, type: string }
      - { name: managementEmail, label: E Mail Management, type: string }
      - { name: managementPhone, label: Telefon Management, type: string }

  - name: websiteImages
    label: Fotos auf der Webseite
    type: file
    path: src/data/images.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero
        label: Großes Bild auf der Startseite
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: homePortrait
        label: Porträt im unteren Bereich der Startseite
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: pagePortrait
        label: Porträt für Vita, Kontakt und Medien
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: gallery
        label: Bilder in der Fotogalerie
        type: object
        list:
          min: 1
          max: 20
          collapsible:
            collapsed: true
            summary: "{credit}, Bild {index}"
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: pressPhotos
        label: Pressefotos im Downloadbereich
        type: object
        list:
          min: 1
          max: 10
          collapsible:
            collapsed: true
            summary: "{label}, Foto {credit}"
        fields:
          - { name: label, label: Bezeichnung, type: string, required: true }
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }

settings:
  commit:
    identity: user
