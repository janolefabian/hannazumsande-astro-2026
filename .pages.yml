media:
  - name: images
    label: Bildarchiv
    input: public/media
    output: /media
    categories: [image]
    rename: safe
  - name: audio
    label: Audio
    input: public/media/audio
    output: /media/audio
    categories: [audio]
    rename: safe
  - name: documents
    label: Dokumente
    input: public/downloads
    output: /downloads
    categories: [document]
    rename: safe

  - name: photoDownloads
    label: Fotos in Originalauflösung
    input: public/downloads/2026
    output: /downloads/2026
    categories: [image]
    rename: safe

content:
  - name: biography
    label: Vita Text
    type: file
    path: src/data/biography.json
    format: json
    operations:
      delete: false
    fields:
      - name: homeHeading
        label: Überschrift beim Vitaabschnitt auf der Startseite
        type: string
        required: true
      - name: body
        label: Vollständige Vita
        type: text
        required: true
        description: "Absätze mit einer Leerzeile trennen. Der erste Absatz erscheint auch auf der Startseite. Die PDF-Dateien werden separat unter Vita Downloads ausgetauscht."

  - name: cds
    label: Diskografie
    type: collection
    path: src/content/cds
    format: json
    filename:
      template: "{title}.json"
      field: create
    view:
      primary: title
      fields: [title, year, label, published]
      sort: [year, title]
      default:
        sort: year
        order: desc
    fields:
      - { name: title, label: Titel, type: string, required: true }
      - { name: subtitle, label: Komponist oder Werk, type: string }
      - name: cover
        label: CD Cover
        type: image
        required: true
        options:
          media: images
      - { name: artists, label: Mitwirkende und Ensembles, type: text }
      - name: conductor
        label: Musikalische Leitung
        type: string
        description: "Nur den Namen eintragen. Die Beschriftung Leitung wird automatisch ergänzt."
      - { name: label, label: Plattenlabel, type: string }
      - name: year
        label: Erscheinungsjahr
        type: number
        options:
          min: 1900
          max: 2100
      - name: link
        label: Link zur Aufnahme
        type: string
        description: "Optional, zum Beispiel zum Label. Vollständige Adresse mit https://."
        pattern:
          regex: '^https?://[^ ]+$'
          message: "Bitte einen Link mit https:// eintragen."
      - name: order
        label: Reihenfolge innerhalb eines Jahres
        type: number
        default: 0
        description: "Optional. Kleinere Zahlen stehen weiter oben. Neue Jahre erscheinen automatisch zuerst."
      - { name: published, label: Veröffentlicht, type: boolean, default: true }

  - name: termine
    label: Kalender
    type: collection
    path: src/content/termine
    format: yaml-frontmatter
    filename:
      template: "{date}-{title}.md"
      field: create
    view:
      fields: [title, date, time, venue, city, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: asc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: time
        label: Uhrzeit
        type: string
        required: true
      - name: venue
        label: Veranstaltungsort
        type: string
        required: true
      - name: city
        label: Stadt
        type: string
      - name: link
        label: Link zum Veranstalter oder zu Tickets
        type: string
        description: "Optional. Bitte die vollständige Adresse mit https:// eintragen."
      - name: photo
        label: Foto
        type: image
        description: "Optional. Foto auswählen oder hochladen. Auch ein Foto allein macht den Auftritt anklickbar."
        options:
          media: images
      - name: photoAlt
        label: Bildbeschreibung
        type: string
        description: "Kurz beschreiben, was auf dem Foto zu sehen ist."
      - name: photoCredit
        label: Fotocredit
        type: string
        description: "Name der Fotografin oder des Fotografen, falls erforderlich."
      - name: featured
        label: Auf der Startseite hervorheben
        type: boolean
      - name: published
        label: Veröffentlicht
        type: boolean
        required: true
      - name: body
        label: Weitere Informationen
        type: rich-text
        description: "Optional, zum Beispiel Programm, weitere Solistinnen und Solisten oder Ensembles. Mit Informationen, Foto oder Veranstalterlink wird der Auftritt anklickbar. Ohne diese Angaben erscheint er nur in der Übersicht."
        options:
          media: false
      - name: example
        label: Enthält noch Beispielinhalt
        type: boolean
        default: false
        description: "Nur für unsere Entwürfe. Diese Detailseite bleibt aus Suchmaschinen und der Sitemap ausgeschlossen. Ausschalten, sobald die Angaben fertig sind."

  - name: vitaDownloads
    label: Vita Downloads
    type: file
    path: src/data/downloads.json
    format: json
    operations:
      delete: false
    fields:
      - name: vitaLong
        label: Vita lang
        type: file
        options:
          media: documents
          extensions: [pdf]
      - name: vitaShort
        label: Vita kurz
        type: file
        description: "Hier die Kurzfassung als PDF auswählen, sobald sie vorliegt."
        options:
          media: documents
          extensions: [pdf]

  - name: website
    label: Grunddaten
    type: file
    path: src/data/settings.json
    format: json
    operations:
      delete: false
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: role, label: Beruf, type: string, required: true }
      - { name: location, label: Ort, type: string }
      - { name: intro, label: Zitat auf der Startseite, type: text, required: true }
      - { name: quoteSource, label: Quelle des Zitats, type: string }
      - { name: email, label: E Mail, type: string, required: true }
      - { name: phone, label: Telefon, type: string }
      - { name: management, label: Management, type: string }
      - { name: managementEmail, label: E Mail Management, type: string }
      - { name: managementPhone, label: Telefon Management, type: string }

  - name: legal
    label: Rechtliches
    type: file
    path: src/data/legal.json
    format: json
    operations:
      delete: false
    fields:
      - name: provider
        label: Gemeinsame Angaben für Impressum und Datenschutz
        type: object
        required: true
        description: "Diese Angaben erscheinen auf beiden Seiten. Die E-Mail-Adresse wird aus Grunddaten übernommen. Eine leere Straße bleibt ein offener Punkt für die finale Veröffentlichung."
        fields:
          - { name: name, label: Vollständiger Anbietername, type: string, required: true }
          - name: street
            label: Straße und Hausnummer
            type: string
            description: "Hier die vollständige, für das Impressum geeignete Anschrift eintragen. Postleitzahl und Ort allein reichen nicht."
          - { name: addressExtra, label: Adresszusatz (optional), type: string }
          - { name: postalCode, label: Postleitzahl, type: string, required: true }
          - { name: city, label: Ort, type: string, required: true }
          - { name: country, label: Land, type: string, required: true }
      - name: imprintBody
        label: Impressumtext
        type: rich-text
        required: true
        description: "Weitere Angaben, Bildnachweise und Texte unterhalb der Anschrift. Name, Adresse und E-Mail nicht erneut eintragen, sie werden automatisch darüber angezeigt."
        options:
          format: html
          media: false
          switcher: false
      - name: privacyBody
        label: Datenschutzerklärung
        type: rich-text
        required: true
        description: "Text unterhalb der automatisch eingefügten verantwortlichen Stelle. Vor Freigabe mit dem tatsächlichen Hosting und allen eingebundenen Diensten abgleichen."
        options:
          format: html
          media: false
          switcher: false
      - name: imprintReviewed
        label: Impressum abschließend geprüft
        type: boolean
        default: false
        description: "Interner Prüfstatus, nicht auf der Webseite sichtbar. Erst nach Prüfung aller erforderlichen Angaben aktivieren. Nach wesentlichen Änderungen erneut prüfen. Der Schalter führt keine rechtliche Prüfung durch."
      - name: privacyReviewed
        label: Datenschutzerklärung abschließend geprüft
        type: boolean
        default: false
        description: "Interner Prüfstatus, nicht auf der Webseite sichtbar. Erst nach Abgleich mit Hosting und eingebundenen Diensten aktivieren. Nach wesentlichen Änderungen erneut prüfen."

  - name: websiteImages
    label: Fotos auf der Webseite
    type: file
    path: src/data/images.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero
        label: Großes Bild auf der Startseite
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: homePortrait
        label: Porträt im unteren Bereich der Startseite
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: vitaPortrait
        label: Foto auf der Vitaseite
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: mediaPortrait
        label: Foto auf der Medienübersicht
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: homeMedia
        label: Bild beim Medienlink auf der Startseite
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: homeContact
        label: Bild beim Kontaktlink auf der Startseite
        type: object
        required: true
        fields:
          - name: src
            label: Bild
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
      - name: gallery
        label: Porträts in der Fotogalerie
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: src
            label: Bild für die Webseite
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
          - name: download
            label: Original zum Herunterladen
            type: image
            description: "Optional. Nur mit einer hier ausgewählten Datei wird ein Download angeboten. Für die Anzeige oben eine kleinere Webversion verwenden."
            options:
              media: photoDownloads

      - name: concertPhotos
        label: Konzertfotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: src
            label: Bild für die Webseite
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
          - { name: caption, label: Konzert und Ort, type: string, required: true }
      - name: pressPhotos
        label: Pressefotos im Downloadbereich
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        fields:
          - name: src
            label: Bild für die Webseite
            type: image
            required: true
            options:
              media: images
          - { name: alt, label: Bildbeschreibung, type: string, required: true }
          - { name: credit, label: Fotocredit, type: string, required: true }
          - name: download
            label: Original zum Herunterladen
            type: image
            description: "Optional. Nur mit einer hier ausgewählten Datei wird ein Download angeboten. Für die Anzeige oben eine kleinere Webversion verwenden."
            options:
              media: photoDownloads

settings:
  commit:
    identity: user
