name: Website veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL }}
  SITE_BASE: ${{ vars.SITE_BASE }}
  PUBLIC_ALLOW_INDEXING: ${{ vars.PUBLIC_ALLOW_INDEXING || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Projekt laden
        uses: actions/checkout@v7
      - name: Astro bauen und hochladen
        uses: withastro/action@v6
      - name: Inhalte und Veröffentlichung prüfen
        run: |
          npm run test:legal
          npm run test:content
          npm run test:built

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
